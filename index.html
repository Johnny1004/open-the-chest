<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b0d07">
  <title>Open the Chest</title>
  <style>
    :root {
      --cream: #fff4d2;
      --gold: #ffc85c;
      --gold-dark: #9b570e;
      --wrong: #ff7878;
      --success: #75ff9e;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      overflow-x: hidden;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 35%, rgba(144, 80, 38, 0.9) 0%, rgba(70, 35, 19, 0.94) 40%, #160905 100%);
      display: grid;
      place-items: center;
    }

    button,
    input { font: inherit; }

    button { touch-action: manipulation; }

    .game {
      width: min(100%, 820px);
      text-align: center;
    }

    .heading-row {
      position: relative;
      padding-inline: 48px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.15rem, 7vw, 5rem);
      line-height: 0.98;
      letter-spacing: 0.02em;
      color: #fff7df;
      text-shadow: 0 5px 12px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 173, 55, 0.25);
    }

    .subtitle {
      max-width: 650px;
      margin: 10px auto 18px;
      color: #ffe3aa;
      font-size: clamp(0.98rem, 2.8vw, 1.2rem);
      line-height: 1.35;
    }

    .sound-button {
      position: absolute;
      top: 0;
      right: 0;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 228, 169, 0.55);
      border-radius: 50%;
      color: #fff4d2;
      background: rgba(31, 14, 7, 0.72);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      font-size: 1.25rem;
    }

    .sound-button:focus-visible,
    .action-button:focus-visible,
    .lock-inputs input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .chest-wrap {
      position: relative;
      width: 100%;
      min-height: 190px;
      user-select: none;
      -webkit-user-select: none;
    }

    #chestImage {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      max-height: 58svh;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.28s ease, filter 0.28s ease;
    }

    .chest-opened #chestImage {
      transform: scale(1.025);
      filter: drop-shadow(0 0 30px rgba(255, 218, 100, 0.9));
    }

    .lock-inputs {
      position: absolute;
      left: 24%;
      top: 45.15%;
      width: 52%;
      height: 7.2%;
      min-height: 27px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1.3%;
    }

    .lock-inputs input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 3px;
      outline: none;
      text-align: center;
      text-transform: uppercase;
      color: #23140a;
      background: linear-gradient(#fffef7, #d8d1bd);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.95),
        inset 0 -4px 5px rgba(0, 0, 0, 0.24),
        0 1px 2px rgba(0, 0, 0, 0.45);
      caret-color: #23140a;
      font-size: clamp(1rem, 4.4vw, 2rem);
      font-weight: 900;
    }

    .lock-inputs input:focus {
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.95),
        inset 0 -4px 5px rgba(0, 0, 0, 0.24),
        0 0 0 3px rgba(255, 221, 122, 0.9);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .action-button {
      min-height: 50px;
      border: 0;
      border-radius: 13px;
      padding: 13px 25px;
      cursor: pointer;
      color: #2a1608;
      background: linear-gradient(#fff0b5, #f4b53f);
      box-shadow: 0 6px 0 var(--gold-dark), 0 11px 18px rgba(0, 0, 0, 0.42);
      font-size: clamp(0.92rem, 2.7vw, 1.05rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
    }

    .action-button.secondary {
      color: #fff3d2;
      background: linear-gradient(#66401f, #382012);
      box-shadow: 0 6px 0 #180b06, 0 11px 18px rgba(0, 0, 0, 0.42);
    }

    .action-button:hover { transform: translateY(-2px); }

    .action-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--gold-dark), 0 6px 10px rgba(0, 0, 0, 0.4);
    }

    .action-button:disabled {
      cursor: default;
      opacity: 0.58;
      transform: none;
    }

    .message {
      min-height: 34px;
      margin-top: 15px;
      font-size: clamp(1.08rem, 3.8vw, 1.35rem);
      font-weight: 900;
      text-shadow: 0 3px 5px rgba(0, 0, 0, 0.75);
    }

    .message.wrong { color: var(--wrong); }
    .message.success { color: var(--success); }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 10;
      width: 10px;
      height: 16px;
      pointer-events: none;
      animation: fall var(--time) linear forwards;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(5px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }

    @keyframes fall {
      to { transform: translate3d(var(--drift), 110vh, 0) rotate(760deg); }
    }

    .shake { animation: shake 0.45s ease; }

    @media (max-width: 520px) {
      body { place-items: start center; }
      .heading-row { padding-inline: 42px; }
      .subtitle { margin-bottom: 10px; }
      .chest-wrap { width: calc(100% + 20px); margin-left: -10px; }
      .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
      .action-button { width: 100%; padding-inline: 10px; }
    }

    @media (max-height: 540px) and (orientation: landscape) {
      body { display: block; padding-block: 10px; }
      .game { margin-inline: auto; }
      h1 { font-size: 2rem; }
      .subtitle { margin-block: 4px 7px; font-size: 0.9rem; }
      #chestImage { max-height: 55vh; }
      .button-row { margin-top: 5px; }
      .action-button { min-height: 42px; padding-block: 9px; }
      .message { min-height: 24px; margin-top: 8px; }
      .sound-button { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="heading-row">
      <h1>Open the Chest</h1>
      <button class="sound-button" id="soundButton" type="button" aria-label="Turn music off" title="Turn music off">🔊</button>
    </div>

    <p class="subtitle">Enter the seven-character combination. You may use letters, numbers, or both.</p>

    <section class="chest-wrap" id="chestWrap" aria-label="Treasure chest game">
      <img id="chestImage" src="chest.png" alt="Locked treasure chest">

      <div class="lock-inputs" id="lockInputs" aria-label="Seven-character combination">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 1">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 2">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 3">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 4">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 5">
        <input type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 6">
        <input type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Character 7">
      </div>
    </section>

    <div class="button-row">
      <button class="action-button" id="openButton" type="button">OPEN THE CHEST</button>
      <button class="action-button secondary" id="resetButton" type="button">RESET</button>
    </div>

    <div class="message" id="message" role="status" aria-live="polite"></div>
  </main>

  <!-- Keep these five resource files in the same folder as this HTML file. -->
  <audio id="bgMusic" src="bg-music.mp3" loop preload="auto"></audio>
  <audio id="winnerSound" src="winner-sound.mp3" preload="auto"></audio>
  <audio id="wrongSound" src="wrong-combination.mp3" preload="auto"></audio>

  <script>
    // EDIT ONLY THE TEXT BETWEEN THE QUOTATION MARKS. It must contain exactly 7 letters/numbers.
    const CORRECT_COMBINATION = "SWNTGYR";

    const inputs = Array.from(document.querySelectorAll(".lock-inputs input"));
    const chestImage = document.getElementById("chestImage");
    const chestWrap = document.getElementById("chestWrap");
    const lockInputs = document.getElementById("lockInputs");
    const message = document.getElementById("message");
    const openButton = document.getElementById("openButton");
    const soundButton = document.getElementById("soundButton");
    const bgMusic = document.getElementById("bgMusic");
    const winnerSound = document.getElementById("winnerSound");
    const wrongSound = document.getElementById("wrongSound");

    const combination = CORRECT_COMBINATION.replace(/[^a-z0-9]/gi, "").toUpperCase();
    let musicAllowed = true;
    let musicStarted = false;
    let gameWon = false;

    if (combination.length !== 7) {
      console.error("CORRECT_COMBINATION must contain exactly seven letters and/or numbers.");
    }

    function playBackgroundMusic() {
      if (!musicAllowed || gameWon) return;
      bgMusic.volume = 0.32;
      bgMusic.play().then(() => {
        musicStarted = true;
      }).catch(() => {
        musicStarted = false;
      });
    }

    function stopAudio(audio) {
      audio.pause();
      audio.currentTime = 0;
    }

    function cleanCharacter(value) {
      return value.replace(/[^a-z0-9]/gi, "").slice(-1).toUpperCase();
    }

    function fillFromText(text, startIndex = 0) {
      const characters = text.replace(/[^a-z0-9]/gi, "").toUpperCase().slice(0, inputs.length - startIndex);
      if (!characters) return;

      characters.split("").forEach((character, offset) => {
        inputs[startIndex + offset].value = character;
      });

      const nextIndex = Math.min(startIndex + characters.length, inputs.length - 1);
      inputs[nextIndex].focus();
      inputs[nextIndex].select();
    }

    inputs.forEach((input, index) => {
      input.addEventListener("focus", playBackgroundMusic);

      input.addEventListener("input", () => {
        const rawValue = input.value;
        input.value = cleanCharacter(rawValue);

        if (input.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].focus();
        } else if (event.key === "ArrowLeft" && index > 0) {
          event.preventDefault();
          inputs[index - 1].focus();
        } else if (event.key === "ArrowRight" && index < inputs.length - 1) {
          event.preventDefault();
          inputs[index + 1].focus();
        } else if (event.key === "Enter") {
          event.preventDefault();
          checkCombination();
        }
      });

      input.addEventListener("paste", (event) => {
        event.preventDefault();
        fillFromText(event.clipboardData.getData("text"), index);
      });
    });

    function getPlayerCombination() {
      return inputs.map(input => input.value).join("").toUpperCase();
    }

    function checkCombination() {
      if (gameWon) return;
      playBackgroundMusic();

      const playerCombination = getPlayerCombination();

      if (playerCombination.length !== 7) {
        showWrong("Enter all seven characters.");
        const emptyInput = inputs.find(input => !input.value);
        if (emptyInput) emptyInput.focus();
        return;
      }

      if (playerCombination === combination) {
        gameWon = true;
        chestImage.src = "chest-open.png";
        chestImage.alt = "Open treasure chest";
        chestWrap.classList.add("chest-opened");
        lockInputs.hidden = true;
        openButton.disabled = true;

        bgMusic.pause();
        winnerSound.currentTime = 0;
        winnerSound.play().catch(() => {});

        message.textContent = "Congratulations! The chest is open!";
        message.className = "message success";
        launchConfetti();
      } else {
        showWrong("Wrong combination. Try again!");
        inputs[0].focus();
        inputs[0].select();
      }
    }

    function showWrong(text) {
      wrongSound.currentTime = 0;
      wrongSound.play().catch(() => {});

      message.textContent = text;
      message.className = "message wrong";

      chestWrap.classList.remove("shake");
      void chestWrap.offsetWidth;
      chestWrap.classList.add("shake");
    }

    function launchConfetti() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const colors = ["#ffc857", "#ff6b6b", "#75ff9e", "#69b7ff", "#d589ff"];
      for (let i = 0; i < 55; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.setProperty("--drift", `${Math.random() * 180 - 90}px`);
        piece.style.setProperty("--time", `${2.3 + Math.random() * 1.8}s`);
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        document.body.appendChild(piece);
        piece.addEventListener("animationend", () => piece.remove());
      }
    }

    function resetGame() {
      gameWon = false;
      chestImage.src = "chest.png";
      chestImage.alt = "Locked treasure chest";
      chestWrap.classList.remove("chest-opened", "shake");
      lockInputs.hidden = false;
      openButton.disabled = false;

      inputs.forEach(input => { input.value = ""; });
      message.textContent = "";
      message.className = "message";

      stopAudio(winnerSound);
      stopAudio(wrongSound);
      playBackgroundMusic();
      inputs[0].focus();
    }

    openButton.addEventListener("click", checkCombination);
    resetButton.addEventListener("click", resetGame);

    soundButton.addEventListener("click", () => {
      musicAllowed = !musicAllowed;

      if (musicAllowed) {
        soundButton.textContent = "🔊";
        soundButton.setAttribute("aria-label", "Turn music off");
        soundButton.title = "Turn music off";
        playBackgroundMusic();
      } else {
        soundButton.textContent = "🔇";
        soundButton.setAttribute("aria-label", "Turn music on");
        soundButton.title = "Turn music on";
        bgMusic.pause();
      }
    });

    document.addEventListener("pointerdown", () => {
      if (!musicStarted) playBackgroundMusic();
    }, { once: true });
  </script>
</body>
</html>
